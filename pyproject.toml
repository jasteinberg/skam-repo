[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "skam"
version = "0.2.0"
description = "Associative memory of structured knowledge (Steinberg & Sompolinsky 2022): reproduction code"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7", "threadpoolctl>=3.1"]

[project.optional-dependencies]
gpu = ["torch>=2.1"]   # optional: --backend torch (CUDA or Apple MPS)

[tool.setuptools]
packages = ["skam"]   # experiments/ and figures/ run from the repo root

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
